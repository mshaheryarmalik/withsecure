services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ciso-backend
    working_dir: /app/backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    # Load environment variables from backend/.env (API keys, etc.)
    env_file:
      - ./backend/.env
    # CORS configuration - allow frontend origins
    # Default allows localhost:3000 (Docker) and localhost:5173 (Vite dev server)
    # For production, set CORS_ORIGINS in backend/.env or override here
    # Example: CORS_ORIGINS=http://localhost:3000,https://yourdomain.com
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    # Persist logs and cache on the host for debugging and reuse
    volumes:
      - ./backend/.logs:/app/backend/.logs
      - ./backend/.cache:/app/backend/.cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # API URL for frontend build
      # Default: http://localhost:8000 (for local Docker development)
      # For production/VM deployment, override with:
      #   VITE_API_URL=http://YOUR_VM_IP:8000
      #   or
      #   VITE_API_URL=https://api.yourdomain.com
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: ciso-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

